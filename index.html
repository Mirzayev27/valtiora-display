<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Valtiora | Meta Display</title>
<style>
:root{color-scheme:dark;--pink:#ff82a9;--white:#fdfaff;--muted:#c2c2cb}*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--white);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer}#screen{position:relative;width:600px;height:600px;overflow:hidden;background:#000;transform-origin:top left}#screen .top{position:absolute;top:36px;left:39px;right:39px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:17px;font-weight:850;letter-spacing:3px}.brand em{color:var(--pink);font-style:normal}.live{display:flex;gap:8px;align-items:center;font-size:12px;color:#d8d7dc;letter-spacing:1px}.dot{width:8px;height:8px;border-radius:50%;background:#7ffbdc;box-shadow:0 0 8px #7ffbdc}.intro{position:absolute;top:99px;left:42px;right:40px}.eyebrow{font-size:12px;color:var(--pink);letter-spacing:2px;font-weight:850}.intro h1{font-size:32px;line-height:1.1;margin:10px 0 5px;font-weight:820;letter-spacing:-.8px}.description{font-size:15px;color:#d8d2da}.player{position:absolute;top:197px;left:53px;width:494px;height:274px;border-radius:16px;overflow:hidden;background:rgba(0,0,0,.93);border:1px solid #85818b;box-shadow:0 0 28px #e7b5c31f}.player video{display:block;width:100%;height:100%;object-fit:contain;filter:brightness(1.12) contrast(1.13) saturate(1.07);background:#080808}.player::after{content:'';position:absolute;inset:0;pointer-events:none;border:1px solid #ffffff19;border-radius:15px}.tag{position:absolute;right:12px;top:12px;padding:5px 11px;border-radius:22px;background:#000d;font-size:12px;border:1px solid #ffffff80;font-weight:760}.load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#050505ee;text-align:center;font-size:18px}.spinner{width:24px;height:24px;border-radius:50%;border:3px solid #ffffff44;border-top-color:var(--pink);animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.load small{font-size:13px;color:#bbb;max-width:360px;line-height:1.5}.load.hidden{display:none}.bottom{position:absolute;bottom:48px;left:41px;right:41px;display:flex;align-items:end;justify-content:space-between}.stats{display:flex;gap:27px}.metric label{display:block;font-size:12px;font-weight:800;letter-spacing:1px;color:#c5c3c9;margin-bottom:5px}.metric strong{font-size:28px}.actions{display:flex;gap:8px}.actions button{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;width:71px;height:67px;border-radius:13px;border:2px solid #777780;background:#141217;font-size:12px;font-weight:780}.actions button .glyph{font-size:25px;line-height:1}.actions button.selected{border-color:var(--pink);background:#40202c;box-shadow:0 0 15px #ff80a533}.notice{position:absolute;bottom:141px;left:44px;right:44px;color:#8dffe4;font-size:13px;line-height:1.4;min-height:18px;text-align:center}.pausedCaption{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#000e;border:1px solid #ffffffbb;border-radius:12px;padding:11px 20px;letter-spacing:1px;font-size:14px;font-weight:bold}.paused .pausedCaption{display:block}#screen{--unused:0}
</style></head><body><main id="screen" aria-label="Valtiora additive display 600 by 600"><div class="top"><span class="brand">VALTI<em>ORA</em></span><span class="live"><span class="dot"></span> WORKOUT ACTIVE</span></div><section class="intro"><div class="eyebrow">EXERCISE <span id="idx">01</span> / <span id="total">05</span></div><h1 id="exercise">CHEST 01</h1><div class="description">Trainer video · live from Mux · auto loop</div></section><div class="player" id="player"><video id="video" playsinline muted autoplay loop preload="auto" crossorigin="anonymous"></video><div class="tag">↻ LOOP</div><div id="loading" class="load"><span class="spinner"></span><span id="loadText">Connecting to Mux…</span><small id="loadHelp">Streaming directly from your Valtiora video library</small></div><span class="pausedCaption">PAUSED</span></div><div id="notice" class="notice"></div><div class="bottom"><div class="stats"><div class="metric"><label>SET</label><strong id="set">1 / 4</strong></div><div class="metric"><label>REPS</label><strong id="reps">12</strong></div></div><nav class="actions" aria-label="Glasses gesture navigation"><button class="selected" data-action="prev" aria-label="Previous video"><span class="glyph">‹</span>Prev</button><button data-action="play" aria-label="Toggle playback"><span class="glyph" id="playIcon">Ⅱ</span><span id="playLabel">Pause</span></button><button data-action="next" aria-label="Next video"><span class="glyph">›</span>Next</button><button data-action="set" aria-label="Next set"><span class="glyph">＋</span>Set</button></nav></div></main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
<script>
(()=>{'use strict';const VIDEOS=[{"name": "CHEST 01", "playbackId": "tyY3E00Qdn6007fVm02NZ1i2qZOkzeep201gJAmGO9d01j1o", "reps": 12, "sets": 4}, {"name": "CHEST 02", "playbackId": "aLfR100KcghrQTqgraOVLrZJf696D1RA1usQ8b0193vPc", "reps": 12, "sets": 4}, {"name": "CHEST 03", "playbackId": "02DIEcnroftL8ry01UhHhH9rg6bu602oHsLYip00oVTne2I", "reps": 12, "sets": 4}, {"name": "SHOULDER 01", "playbackId": "4m4PqXSCg31Hq2lmHnur901lqWFpArfPNqm9isxG4qSw", "reps": 12, "sets": 4}, {"name": "SHOULDER 02", "playbackId": "OjchxaW4wH02pIKY02GRc02qbm00BK8piv1MmMIoMHCgkpo", "reps": 12, "sets": 4}];let list=VIDEOS.map(v=>({...v}));let index=0,curSet=1,paused=false,focused=0,hls=null,currentUrl='',errorTimer=null;const $=id=>document.getElementById(id),video=$('video'),buttons=[...document.querySelectorAll('.actions button')];let notifyTimer;function notify(t){$('notice').textContent=t;clearTimeout(notifyTimer);notifyTimer=setTimeout(()=>$('notice').textContent='',3300)}function loading(t,help='Streaming from Mux'){ $('loadText').textContent=t;$('loadHelp').textContent=help;$('loading').classList.remove('hidden')}function ready(){$('loading').classList.add('hidden')}function destroy(){clearTimeout(errorTimer);if(hls){hls.destroy();hls=null}video.pause();video.removeAttribute('src');video.load()}function source(v){if(v.url)return v.url;return 'https://stream.mux.com/'+encodeURIComponent(v.playbackId)+'.m3u8?max_resolution=720p'}function stream(){const v=list[index];destroy();currentUrl=source(v);loading('Connecting to Mux…','Live HLS playback · '+v.name);video.muted=true;video.loop=true;video.playsInline=true;video.addEventListener('canplay',ready,{once:true});function start(){if(!paused)video.play().then(ready).catch(()=>loading('Select Play to begin','Browser autoplay may require a gesture'))}if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=currentUrl;video.load();start()}else if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:false,backBufferLength:10});hls.loadSource(currentUrl);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,start);hls.on(Hls.Events.ERROR,(_,err)=>{if(err.fatal){loading('Video could not be loaded',err.details+' · Check playback ID or video permissions')}})}else{loading('HLS playback not supported','Open in the latest Chrome or Safari with internet access')}errorTimer=setTimeout(()=>{if($('loading').classList.contains('hidden'))return;loading('Still loading…','Check internet and Mux playback access')},14000)}function render(skipStream=false){const v=list[index];$('exercise').textContent=v.name;$('idx').textContent=String(index+1).padStart(2,'0');$('total').textContent=String(list.length).padStart(2,'0');$('set').textContent=curSet+' / '+v.sets;$('reps').textContent=v.reps;$('playLabel').textContent=paused?'Play':'Pause';$('playIcon').textContent=paused?'▶':'Ⅱ';$('player').classList.toggle('paused',paused);if(!skipStream)stream()}function action(a){if(a==='prev'||a==='next'){index=(index+(a==='next'?1:-1)+list.length)%list.length;curSet=1;paused=false;render()}else if(a==='play'){paused=!paused;if(paused){video.pause();render(true)}else{render(true);video.play().then(ready).catch(()=>notify('Select Play again to allow playback'))}}else if(a==='set'){curSet=curSet%list[index].sets+1;render(true);notify('Set '+curSet+' / '+list[index].sets)}}function focus(n){focused=(n+buttons.length)%buttons.length;buttons.forEach((b,i)=>{b.classList.toggle('selected',i===focused);b.tabIndex=i===focused?0:-1})}buttons.forEach((b,i)=>b.addEventListener('click',()=>{focus(i);action(b.dataset.action)}));window.addEventListener('message',e=>{if(e.source!==window.parent)return;if(e.data?.type==='gesture'){const k=e.data.key;if(k==='ArrowRight')action('next');else if(k==='ArrowLeft')action('prev');else if(k==='ArrowDown')focus(focused+1);else if(k==='ArrowUp')focus(focused-1);else if(k==='Enter'||k===' ')action(buttons[focused].dataset.action)}});window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();action('next')}else if(e.key==='ArrowLeft'){e.preventDefault();action('prev')}else if(e.key==='ArrowDown'){e.preventDefault();focus(focused+1)}else if(e.key==='ArrowUp'){e.preventDefault();focus(focused-1)}else if(e.key==='Enter'||e.key===' '){e.preventDefault();action(buttons[focused].dataset.action)}});window.addEventListener('keydown',e=>{if(/^[1-5]$/.test(e.key)){const n=Number(e.key)-1;if(n<list.length){index=n;curSet=1;paused=false;render()}}});let swipeX=null;document.getElementById('screen').addEventListener('touchstart',e=>{swipeX=e.touches[0]?.clientX??null},{passive:true});document.getElementById('screen').addEventListener('touchend',e=>{if(swipeX===null)return;const dx=(e.changedTouches[0]?.clientX??swipeX)-swipeX;swipeX=null;if(Math.abs(dx)>65)action(dx<0?'next':'prev')},{passive:true});video.addEventListener('ended',()=>{video.currentTime=0;if(!paused)video.play().catch(()=>{})});video.addEventListener('error',()=>loading('Playback error','Check your Mux video access policy and network'));window.ValtioraDisplay={action,setVideos(data){if(!Array.isArray(data)||!data.length)return;list=data.map(v=>({name:String(v.name||'Exercise'),playbackId:String(v.playbackId||''),url:v.url||'',sets:Number(v.sets)||4,reps:Number(v.reps)||12}));index=0;curSet=1;paused=false;render()},select(n){if(n>=0&&n<list.length){index=n;curSet=1;paused=false;render()}},getState(){return {index,curSet,paused,count:list.length,playbackId:list[index].playbackId}}};function resize(){let scale=Math.min(innerWidth/600,innerHeight/600,1);$('screen').style.transform='scale('+scale+')'}addEventListener('resize',resize);resize();render()})();
</script></body></html>
